<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A local LaTeX editor with instant preview, powered by WebAssembly." />
    <title>LightningTeX</title>
    <script>
      // Resolve the theme before first paint; ui/settings.js owns the stored shape.
      try {
        var saved = JSON.parse(localStorage.getItem('lightningtex:settings:v1') || '{}');
        var dark = saved.theme === 'dark' || (saved.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
